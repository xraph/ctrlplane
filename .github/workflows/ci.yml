name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # required by go-ci.yml's gosec SARIF upload
  security-events: write

jobs:
  # ─── Go Build & Test ────────────────────────────────────────────────
  # test, lint, verify and security via the shared workflow. The Makefile has
  # no test/lint/vet targets, so its probe falls back to the plain go commands
  # this job used to run directly.
  ci:
    uses: xraph/workflows/.github/workflows/go-ci.yml@v1
    with:
      go-versions: '["1.26"]'
      os: '["ubuntu-latest"]'
      # GO-2026-5932 in golang.org/x/crypto has no published fix ("Fixed in:
      # N/A"), so a blocking govulncheck would keep CI red indefinitely.
      # Findings are still scanned and reported in the run summary.
      # Flip back to true once upstream ships a patch.
      govulncheck-fail-on-findings: false

  persistence:
    name: Persistent store contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ctrlplane_test
          POSTGRES_PASSWORD: ctrlplane_local_test
          POSTGRES_DB: ctrlplane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctrlplane_test -d ctrlplane_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CTRLPLANE_TEST_POSTGRES_DSN: postgres://ctrlplane_test:ctrlplane_local_test@127.0.0.1:5432/ctrlplane_test?sslmode=disable
      CTRLPLANE_TEST_MONGO_URI: mongodb://127.0.0.1:27017
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go.sum
      - name: Verify persistent stores and HTTP contracts
        run: go test -race -count=1 -v ./extension/contract ./store/sqlite ./store/postgres ./store/mongo

  # ─── Format Check ──────────────────────────────────────────────────
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.7"
          cache: true
          cache-dependency-path: go.sum

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Check formatting (goimports)
        run: |
          OUTPUT=$(goimports -l -local github.com/xraph/ctrlplane .)
          if [ -n "$OUTPUT" ]; then
            echo "::error::The following files need goimports formatting:"
            echo "$OUTPUT"
            exit 1
          fi

  # ─── Docs ───────────────────────────────────────────────────────────
  docs:
    name: Docs
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docs

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('docs/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm types:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
