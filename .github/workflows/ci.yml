name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # required by go-ci.yml's gosec SARIF upload
  security-events: write

jobs:
  # ─── Go Build & Test ────────────────────────────────────────────────
  # The shared workflow runs the repository Make targets and blocks findings.
  ci:
    uses: xraph/workflows/.github/workflows/go-ci.yml@v1
    with:
      go-versions: '["1.26.9"]'
      primary-go-version: "1.26.9"
      os: '["ubuntu-latest"]'
      govulncheck-version: "v1.6.0"

  dependency-security:
    name: Complete Go dependency security
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.26.9
      GOWORK: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.9"
          cache: true
          cache-dependency-path: go.sum
      - name: Inventory standalone module and executable graphs
        run: |
          mkdir -p dependency-evidence
          test "$(go env GOVERSION)" = go1.26.9
          test "$(go env GOWORK)" = off
          git ls-files '*go.mod' '*go.work*' > dependency-evidence/tracked-modules.txt
          python3 -c 'from pathlib import Path; assert Path("dependency-evidence/tracked-modules.txt").read_text().splitlines() == ["go.mod", "qualification/oldb23a/go.mod"]'
          go list -m -json all > dependency-evidence/modules.json
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          data = Path("dependency-evidence/modules.json").read_text()
          decoder = json.JSONDecoder()
          while data.strip():
              module, offset = decoder.raw_decode(data.lstrip())
              if module.get("Replace"):
                  raise SystemExit("effective replacement: " + module["Path"])
              data = data.lstrip()[offset:]
          PYCODE
          go list -deps -test -json ./... > dependency-evidence/imports-tests.json
          go list -deps -json ./cmd/controlplane > dependency-evidence/program.json
          go build -o dependency-evidence/controlplane ./cmd/controlplane
          go version -m dependency-evidence/controlplane > dependency-evidence/binary-build.txt
      - name: Verify fixed published old executable
        working-directory: qualification/oldb23a
        run: |
          go mod tidy -diff
          go mod verify
          go vet ./...
          go test -race -count=1 ./...
          go list -m -json all > ../../dependency-evidence/oldb23a-modules.json
          go build -mod=readonly -trimpath -o ../../dependency-evidence/oldb23a .
          ../../dependency-evidence/oldb23a identity > ../../dependency-evidence/oldb23a-identity.json
          go version -m ../../dependency-evidence/oldb23a > ../../dependency-evidence/oldb23a-build.txt
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          decoder = json.JSONDecoder()
          data = Path("../../dependency-evidence/oldb23a-modules.json").read_text()
          while data.strip():
              module, offset = decoder.raw_decode(data.lstrip())
              assert not module.get("Replace"), module["Path"]
              data = data.lstrip()[offset:]
          identity = json.loads(Path("../../dependency-evidence/oldb23a-identity.json").read_text())
          assert identity["version"] == "v1.7.1-0.20261011231032-8827a4f36fad"
          assert identity["sum"] == "h1:KKPnswqMXoylKncOYcW/PBx5xzi8i39xa4ql0wZU198="
          assert not identity["replaced"]
          PYCODE
      - name: Lint old executable module
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: qualification/oldb23a
      - name: Install pinned scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Scan imports, tests, program and actual binary
        run: |
          govulncheck -test -json ./... > dependency-evidence/imports-tests-vuln.json
          govulncheck -json ./cmd/controlplane > dependency-evidence/program-vuln.json
          govulncheck -mode=binary -json dependency-evidence/controlplane > dependency-evidence/binary-vuln.json
          (cd qualification/oldb23a && govulncheck -test -json ./...) > dependency-evidence/oldb23a-imports-tests-vuln.json
          govulncheck -mode=binary -json dependency-evidence/oldb23a > dependency-evidence/oldb23a-binary-vuln.json
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          decoder = json.JSONDecoder()
          called = []
          for path in sorted(Path("dependency-evidence").glob("*-vuln.json")):
              data = path.read_text()
              records = 0
              while data.strip():
                  record, offset = decoder.raw_decode(data.lstrip())
                  data = data.lstrip()[offset:]
                  records += 1
                  finding = record.get("finding")
                  if finding:
                      print(path.name, json.dumps(finding, sort_keys=True))
                      if any(frame.get("function") for frame in finding.get("trace", [])):
                          called.append((path.name, finding["osv"]))
              if not records:
                  raise SystemExit("empty scanner output: " + str(path))
          if called:
              raise SystemExit("called vulnerable symbols: " + repr(called))
          PYCODE
      - name: Retain complete dependency evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-security-evidence
          path: dependency-evidence/
          if-no-files-found: error

  persistence:
    name: Persistent store contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ctrlplane_test
          POSTGRES_PASSWORD: ctrlplane_local_test
          POSTGRES_DB: ctrlplane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctrlplane_test -d ctrlplane_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GOTOOLCHAIN: go1.26.9
      GOWORK: "off"
      CTRLPLANE_TEST_POSTGRES_DSN: postgres://ctrlplane_test:ctrlplane_local_test@127.0.0.1:5432/ctrlplane_test?sslmode=disable
      CTRLPLANE_TEST_MONGO_URI: mongodb://127.0.0.1:27017
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.9"
          cache: true
          cache-dependency-path: go.sum
      - name: Verify persistent stores and HTTP contracts
        run: |
          set -euo pipefail
          mkdir -p managed-maximum-evidence
          go test -race -count=1 -timeout=30m -json ./extension/contract ./store ./store/sqlite ./store/postgres ./store/mongo | tee managed-maximum-evidence/fix1-persistent-race.jsonl

      - name: Qualify successor fix boundaries in Memory and codecs
        env:
          GOMAXPROCS: "2"
          GOFLAGS: -p=1
        run: |
          set -euo pipefail
          go test -race -json ./managed ./store/memory -run '^(TestRemovalContinuationCapPlusOne|TestManagedRemovalContinuationMemory(MissingHistoricalLink|ParentBoundary|CounterBounds|GenerationBoundary|ExpiredFinish|StorageCaps))$' -count=1 -timeout=30m | tee managed-maximum-evidence/fix1-memory-race.jsonl
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          base = Path("managed-maximum-evidence")
          store = "github.com/xraph/ctrlplane/store"
          cases = ["MissingHistoricalLink", "ParentBoundary", "CounterBounds", "GenerationBoundary", "ExpiredFinish", "StorageCaps"]
          expected = {(store + "/memory", "TestManagedRemovalContinuationMemory" + case) for case in cases}
          expected.update((store, "TestManagedRemovalContinuationPostgres" + case) for case in cases)
          expected.update((store, name) for name in ["TestManagedRemovalContinuationRecoveryIdentity", "TestManagedRemovalContinuationInputCaps", "TestManagedRemovalContinuationPostgresUncertainReopen"])
          expected.add(("github.com/xraph/ctrlplane/managed", "TestRemovalContinuationCapPlusOne"))
          expected.update((store, "TestManagedRemovalContinuationPostgresUncertainReopen/" + mode) for mode in ["persisted", "absent"])
          rows = [json.loads(line) for name in ["fix1-persistent-race", "fix1-memory-race"] for line in (base / (name + ".jsonl")).read_text().splitlines()]
          passed = {(row.get("Package"), row.get("Test")) for row in rows if row.get("Action") == "pass"}
          failed = [row for row in rows if row.get("Action") in {"skip", "fail"} and any(row.get("Package") == package and (row.get("Test", "") == test or row.get("Test", "").startswith(test + "/")) for package, test in expected)]
          if expected - passed or failed:
              raise SystemExit("Incomplete successor fix qualification")
          (base / "fix1-coverage-audit.json").write_text(json.dumps({"required_passes": sorted(expected), "skipped_or_failed": failed}, indent=2) + "\n")
          PYCODE

      - name: Qualify maximum individual removal lifecycle
        env:
          CTRLPLANE_MANAGED_MAXIMUM: individual
          GOMAXPROCS: "2"
          GOFLAGS: -p=1
        run: |
          set -euo pipefail
          test -n "$CTRLPLANE_TEST_POSTGRES_DSN"
          mkdir -p managed-maximum-evidence
          go test -json ./store ./store/memory -run '^(TestManagedAttemptFullFiniteSet|TestManagedAttemptPostgresFullFiniteSetNearLimit|TestManagedAttemptMemoryFullFiniteSetNearLimit)$' -count=1 -timeout=30m | tee managed-maximum-evidence/individual-normal.jsonl

      - name: Qualify maximum batch removal lifecycle
        env:
          CTRLPLANE_MANAGED_MAXIMUM: batch
          GOMAXPROCS: "2"
          GOFLAGS: -p=1
        run: |
          set -euo pipefail
          test -n "$CTRLPLANE_TEST_POSTGRES_DSN"
          mkdir -p managed-maximum-evidence
          go test -json ./store ./store/memory -run '^TestManagedQuiescenceBatch(FullFiniteSet|PostgresFullFiniteSetNearLimit|MemoryFullFiniteSetNearLimit)$' -count=1 -timeout=30m | tee managed-maximum-evidence/batch-normal.jsonl

      - name: Qualify maximum batch removal lifecycle under race
        env:
          CTRLPLANE_MANAGED_MAXIMUM: batch
          GOMAXPROCS: "2"
          GOFLAGS: -p=1
        run: |
          set -euo pipefail
          test -n "$CTRLPLANE_TEST_POSTGRES_DSN"
          mkdir -p managed-maximum-evidence
          go test -race -json ./store ./store/memory -run '^TestManagedQuiescenceBatch(FullFiniteSet|PostgresFullFiniteSetNearLimit|MemoryFullFiniteSetNearLimit)$' -count=1 -timeout=30m | tee managed-maximum-evidence/batch-race.jsonl

      - name: Qualify maximum successor lifecycle under race
        env:
          CTRLPLANE_MANAGED_MAXIMUM: successor
          GOMAXPROCS: "2"
          GOFLAGS: -p=1
        run: |
          set -euo pipefail
          test -n "$CTRLPLANE_TEST_POSTGRES_DSN"
          mkdir -p managed-maximum-evidence
          go test -race -json ./store -run '^TestManagedRemovalContinuationFullFiniteSet$' -count=1 -timeout=30m | tee managed-maximum-evidence/successor-race.jsonl

      - name: Qualify pinned old executable behavior
        env:
          CTRLPLANE_OLD_B23A_REQUIRED: "1"
          GOMAXPROCS: "2"
          GOFLAGS: -p=1
        run: |
          set -euo pipefail
          mkdir -p managed-maximum-evidence
          (cd qualification/oldb23a && go build -mod=readonly -trimpath -o ../../managed-maximum-evidence/oldb23a .)
          export CTRLPLANE_OLD_B23A_BINARY="$PWD/managed-maximum-evidence/oldb23a"
          "$CTRLPLANE_OLD_B23A_BINARY" identity > managed-maximum-evidence/oldb23a-identity.json
          go test -race -json ./store -run '^TestManagedAttemptPostgresOldB23aBinary$' -count=1 -timeout=10m | tee managed-maximum-evidence/oldb23a-race.jsonl

      - name: Verify maximum campaign coverage
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          base = Path("managed-maximum-evidence")
          expected = {
              "individual-normal": {
                  "TestManagedAttemptFullFiniteSet",
                  "TestManagedAttemptFullFiniteSet/memory",
                  "TestManagedAttemptFullFiniteSet/postgres",
                  "TestManagedAttemptPostgresFullFiniteSetNearLimit",
                  "TestManagedAttemptPostgresFullFiniteSetNearLimit/postgres",
                  "TestManagedAttemptMemoryFullFiniteSetNearLimit",
                  "TestManagedAttemptMemoryFullFiniteSetNearLimit/true",
                  "TestManagedAttemptMemoryFullFiniteSetNearLimit/false",
              },
              "batch-normal": {
                  "TestManagedQuiescenceBatchFullFiniteSet",
                  "TestManagedQuiescenceBatchFullFiniteSet/memory",
                  "TestManagedQuiescenceBatchFullFiniteSet/postgres",
                  "TestManagedQuiescenceBatchPostgresFullFiniteSetNearLimit",
                  "TestManagedQuiescenceBatchPostgresFullFiniteSetNearLimit/postgres",
                  "TestManagedQuiescenceBatchMemoryFullFiniteSetNearLimit",
                  "TestManagedQuiescenceBatchMemoryFullFiniteSetNearLimit/true",
                  "TestManagedQuiescenceBatchMemoryFullFiniteSetNearLimit/false",
              },
          }
          expected["batch-race"] = expected["batch-normal"]
          expected["successor-race"] = {
              "TestManagedRemovalContinuationFullFiniteSet",
              "TestManagedRemovalContinuationFullFiniteSet/memory",
              "TestManagedRemovalContinuationFullFiniteSet/postgres",
          }
          expected["oldb23a-race"] = {"TestManagedAttemptPostgresOldB23aBinary"}
          expected["oldb23a-race"].update("TestManagedAttemptPostgresOldB23aBinary/" + case for case in ["gen1_control", "successor_refusal", "continue_envelopes", "legacy_refusal", "collision_no_change", "historical_nonissuing", "reopen_refusal", "journal_advance_limitation"])
          summary = {}
          for campaign, required in expected.items():
              rows = [json.loads(line) for line in (base / (campaign + ".jsonl")).read_text().splitlines()]
              refused = [row for row in rows if row.get("Action") in {"skip", "fail"} or "no tests to run" in row.get("Output", "")]
              required = {("github.com/xraph/ctrlplane/store/memory" if "MemoryFullFiniteSetNearLimit" in name else "github.com/xraph/ctrlplane/store", name) for name in required}
              passed = {(row.get("Package"), row.get("Test")) for row in rows if row.get("Action") == "pass"}
              packages = {row.get("Package") for row in rows if row.get("Action") == "pass" and not row.get("Test")}
              expected_packages = {"github.com/xraph/ctrlplane/store"}
              if campaign not in {"successor-race", "oldb23a-race"}:
                  expected_packages.add("github.com/xraph/ctrlplane/store/memory")
              if refused or required - passed or packages != expected_packages:
                  raise SystemExit("Incomplete maximum campaign: " + campaign)
              summary[campaign] = {"required_passes": sorted(required), "packages": sorted(packages)}
          (base / "coverage-audit.json").write_text(json.dumps(summary, indent=2) + "\n")
          PYCODE

      - name: Retain maximum campaign evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: managed-maximum-evidence
          path: managed-maximum-evidence/
          if-no-files-found: warn

  # ─── Format Check ──────────────────────────────────────────────────
  format:
    name: Format
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.26.9
      GOWORK: "off"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Check formatting (goimports)
        run: |
          OUTPUT=$(goimports -l -local github.com/xraph/ctrlplane .)
          if [ -n "$OUTPUT" ]; then
            echo "::error::The following files need goimports formatting:"
            echo "$OUTPUT"
            exit 1
          fi

  # ─── Docs ───────────────────────────────────────────────────────────
  docs:
    name: Docs
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docs

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.3"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.34.6"

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('docs/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit complete dependency graph
        run: pnpm audit

      - name: Type check
        run: pnpm types:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
